[program:appointments-kit-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/appointments-kit/current/artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=90
directory=/var/www/appointments-kit/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/appointments-kit/current/storage/logs/worker.log
stopwaitsecs=3600
